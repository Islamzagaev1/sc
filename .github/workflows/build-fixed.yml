
name: Build SoundCloud FULL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Combine and extract archive
        run: |
          cat SoundCloud-source.part01 SoundCloud-source.part02 > source.zip
          mkdir -p source
          unzip -q source.zip -d source
          PROJECT_DIR=$(find source -name gradlew -type f -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: gradlew not found"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .
          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build FULL Debug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-FULL-APK
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
