
name: Build SoundCloud FULL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download SoundCloud source
        uses: actions/checkout@v4
        with:
          repository: Islamzagaev1/SoundCloud-Android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build FULL Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-FULL-APK
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
  
