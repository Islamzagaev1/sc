
name: Build SoundCloud KWGT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore experimental source
        shell: bash
        run: |
          cat SoundCloud-source.part01 SoundCloud-source.part02 > source.zip
          echo "284e5c44583569f295d6e89cc3679b08ed5d07b6beb493453fd4c783d24e2e3b  source.zip" | sha256sum -c -
          unzip -tq source.zip
          mkdir -p project
          unzip -q source.zip -d project
          test -f project/SoundCloud-Android-main/gradlew

      - name: Verify KWGT changes
        shell: bash
        run: |
          cd project/SoundCloud-Android-main
          SERVICE=app/src/main/java/com/scd/android/PlaybackService.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          GRADLE=app/build.gradle.kts

          grep -Fq 'MediaLibraryService()' "$SERVICE"
          grep -Fq 'MediaLibrarySession.Builder' "$SERVICE"
          grep -Fq 'androidx.media3.session.MediaLibraryService' "$MANIFEST"
          grep -Fq 'android.media.browse.MediaBrowserService' "$MANIFEST"
          grep -Fq 'applicationIdSuffix = ".full.kwgt"' "$GRADLE"

          echo "KWGT source changes verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build KWGT FULL APK
        working-directory: project/SoundCloud-Android-main
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload KWGT APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-KWGT-Experimental-APK
          path: project/SoundCloud-Android-main/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
